<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Amin Bolani</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --brown-dark: #1a0f0a;
      --brown-medium: #2c1810;
      --brown-card: #24140d;
      --brown-gold: #d97706;
      --brown-cream: #fef3c7;
      --brown-light-bg: #fffbeb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--brown-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--brown-card);
      border: 2px solid var(--brown-medium);
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .login-logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .login-logo span {
      color: var(--brown-gold);
    }

    .login-subtitle {
      color: #d1bcad;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: var(--brown-cream);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brown-gold);
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      background: var(--brown-dark);
      border: 1px solid var(--brown-medium);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-wrapper input:focus {
      border-color: var(--brown-gold);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--brown-gold);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    .login-btn:hover {
      background: #b45309;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-logo">AMIN <span>BOLANI</span></div>
    <p class="login-subtitle">Admin Panel Authorization</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="login-btn">Login to Dashboard</button>
      <div id="errorMsg" class="error-msg">Invalid username or password!</div>
    </form>
  </div>

  <script>
    // Pehle se login check: Agar token hai toh direct dashboard par bhej do
    if (localStorage.getItem("adminAuth") === "true") {
      window.location.href = "awm-dashboard.html";
    }

    const BACKEND_URL = "https://amin-backend.vercel.app"; // Live hone par Vercel URL aayega

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("errorMsg");

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem("adminAuth", "true");
          window.location.href = "awm-dashboard.html";
        } else {
          errorMsg.innerText = data.message || "Invalid username or password!";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        // Backend connect nahi hone par local check (Testing Phase)
        if(username === "admin" && password === "123456") {
          localStorage.setItem("adminAuth", "true");
          window.location.href = "awm-dashboard.html";
        } else {
          errorMsg.innerText = "Error connecting to server!";
          errorMsg.style.display = "block";
        }
      }
    });
  </script>
</body>
</html>
